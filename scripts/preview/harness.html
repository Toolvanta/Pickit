<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Pickit overlay harness</title>
    <style>
      :root {
        --brand-600: #5548e0;
        --ok-500: hsl(152 68% 28%);
      }
      body {
        margin: 0;
        font-family: Georgia, serif;
        color: #17171f;
      }
      nav {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 16px 24px;
        border-bottom: 1px solid #e2e2ea;
        font-family: system-ui;
      }
      .bands {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        height: 160px;
      }
      main {
        padding: 24px;
        max-width: 720px;
      }
      h1 {
        font: 700 40px/1.1 Arial, sans-serif;
        letter-spacing: -0.02em;
        margin: 0 0 12px;
      }
      p {
        font-size: 18px;
        line-height: 1.6;
      }
      code {
        font: 14px 'Definitely Missing Font', Consolas, monospace;
        color: #c2343f;
      }
      a {
        color: #5548e0;
      }
    </style>
    <script>
      // Preview only: open shadow roots so the overlay can be inspected from tests.
      const attach = Element.prototype.attachShadow;
      Element.prototype.attachShadow = function (init) {
        return attach.call(this, { ...init, mode: 'open' });
      };
    </script>
    <script src="/__stub.js"></script>
  </head>
  <body>
    <nav>
      <button onclick="__pkSend({ t: 'pk:start', mode: 'color' })">Pick colour</button>
      <button onclick="__pkSend({ t: 'pk:start', mode: 'font' })">Inspect font</button>
      <a href="/popup.html">Popup</a>
      <a href="/sidepanel.html">Side panel</a>
      <a href="/options.html">Settings</a>
      <a href="/welcome.html">Welcome</a>
    </nav>
    <div class="bands">
      <div data-band style="background: var(--brand-600)"></div>
      <div data-band style="background: var(--ok-500)"></div>
      <div data-band style="background: #fbbf24"></div>
      <div data-band style="background: #fb7185"></div>
    </div>
    <main>
      <h1 id="title">Heading in Arial Bold</h1>
      <p id="body">
        Body copy in Georgia at eighteen pixels. <a id="link" href="#clicked">A link that must not navigate</a>.
      </p>
      <p><code id="code">code { falls: back; }</code></p>
    </main>
    <script>
      // Stand-in for chrome.tabs.captureVisibleTab: repaints the colour bands at device resolution.
      window.__capture = () => {
        const dpr = devicePixelRatio;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(innerWidth * dpr);
        canvas.height = Math.round(innerHeight * dpr);
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (const band of document.querySelectorAll('[data-band]')) {
          const r = band.getBoundingClientRect();
          ctx.fillStyle = getComputedStyle(band).backgroundColor;
          ctx.fillRect(r.left * dpr, r.top * dpr, r.width * dpr, r.height * dpr);
        }
        window.__captures = (window.__captures ?? 0) + 1;
        return canvas.toDataURL('image/png');
      };
    </script>
    <script src="/overlay.js"></script>
  </body>
</html>
